services:
  llm-core:
    build:
      context: .
      dockerfile: dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_PORT: ${APP_PORT:-9000}
      HF_HOME: /models/huggingface
    ports:
      - "${APP_PORT:-9000}:${APP_PORT:-9000}"
    volumes:
      # Mount the complete WSL2 project so edits are reflected immediately.
      - type: bind
        source: ./
        target: /app
      # Keep downloaded Hugging Face models when the container is recreated.
      - type: bind
        source: ./models
        target: /models
    gpus: all
    init: true
    restart: unless-stopped
    tty: true
